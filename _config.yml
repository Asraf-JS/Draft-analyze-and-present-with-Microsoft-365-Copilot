title: "Draft, Analyze, and Present with Microsoft 365 Copilot"
author: "[Your Name] — Trainocate / TED Learning"
github_repo: "https://github.com/[your-username]/[your-repo-name]"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: true
